<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jadwal Jaga Satpam</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div>
          <h1>Jadwal Jaga Satpam</h1>
          <p>Made, Irfan, dan Hendra</p>
        </div>

        <a class="admin-link" href="/admin.html">Admin</a>
      </header>

      <section class="controls">
        <label>
          Bulan
          <select id="monthSelect"></select>
        </label>

        <label>
          Tahun
          <input id="yearInput" type="number" min="2020" max="2100" />
        </label>

        <button id="loadButton">Tampilkan</button>
      </section>

      <section>
        <h2>Kalender</h2>
        <div id="calendar" class="calendar"></div>
      </section>

      <section>
        <h2>Rekap Bulanan</h2>
        <div id="summary"></div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
